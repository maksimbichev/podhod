<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F6F6F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Подход">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<!-- Ни одного внешнего запроса: без шрифтов, CDN и аналитики. Данные живут только на устройстве. -->
<title>Подход</title>
<style>
:root{
  --bg:#F6F6F7; --card:#FFFFFF; --tile:#EFEFF1; --tile2:#E3E3E7;
  --line:#E6E6E9; --line2:#D5D5DA; --text:#141414; --muted:#76767C; --muted2:#B8B8BD;
  --ink:#141414; --acc:#F25F0C; --acc-soft:#FFEDE3; --acc-text:#B4410B; --red:#E5383B;
  --pain:#D7263D; --pain-soft:#FFE6E8; --pain-text:#B0172A; --good:#1F9D55; --bad:#D7263D;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:16px;line-height:1.35;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;touch-action:manipulation;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;}
input{font:inherit;-webkit-user-select:text;user-select:text;}
::-webkit-scrollbar{width:0;height:0;}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;}
header{flex:none;padding:calc(var(--safe-t) + 14px) 16px 10px;}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:4px 16px 36px;}
footer{flex:none;padding:10px 16px calc(var(--safe-b) + 12px);}
footer:empty{display:none;}
.hrow{display:flex;align-items:center;gap:12px;}
.grow{flex:1;min-width:0;}
.h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;}
.h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
.h3{font-size:19px;font-weight:800;margin:22px 0 4px;}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:3px;}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.icon-btn svg{width:22px;height:22px;}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.hint{color:var(--muted);font-size:14px;font-weight:500;line-height:1.45;margin:6px 0 0;}
.link{display:block;width:100%;text-align:center;padding:14px;color:var(--muted);font-weight:700;font-size:14.5px;}
.ver{text-align:center;color:var(--muted2);font-size:12px;font-weight:700;padding:4px 0 8px;}
.warn{background:#FFECEC;color:#B3261E;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;margin:8px 0 12px;line-height:1.4;}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-weight:600;line-height:1.5;}
/* отклик на нажатие */
.row,.icon-btn,.chip,.sh-x,.daychip,.painbtn,.weekcard,.big-btn{transition:transform .12s;}
.row:active,.icon-btn:active,.chip:active,.sh-x:active,.daychip:active,.painbtn:active,.weekcard:active,.big-btn:active{transform:scale(.97);}
.link:active,.rmset:active{opacity:.55;}

/* Главный */
.weekcard{display:block;width:100%;cursor:pointer;}
.week{display:flex;align-items:center;gap:14px;}
.dots{display:flex;gap:7px;flex:none;}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--tile2);display:block;}
.dots i.on{background:var(--ink);}
.week.closed .dots i.on{background:var(--acc);}
.wk-t{font-weight:800;font-size:17px;letter-spacing:-.01em;}
.wk-s{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px;}
.flame{display:inline-flex;align-items:center;gap:3px;color:var(--acc);font-weight:800;font-size:17px;flex:none;}
.flame svg{width:18px;height:18px;}
.chev{color:var(--muted2);flex:none;display:grid;place-items:center;}
.chev svg{width:20px;height:20px;}
.chain{display:flex;gap:5px;margin-top:14px;}
.chain i{flex:1;height:10px;border-radius:4px;background:var(--tile);display:block;}
.chain i.on{background:var(--acc);}
.chain i.cur:not(.on){background:transparent;box-shadow:inset 0 0 0 2px var(--ink);}
.chain-l{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700;margin-top:7px;}
.first{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.first .h3{margin:0 0 4px;}
.cta{display:block;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:26px;padding:24px 22px;margin:2px 0 12px;transition:transform .12s;}
.cta:active{transform:scale(.98);}
.cta-t{display:block;font-size:25px;font-weight:800;letter-spacing:-.02em;}
.cta-s{display:block;font-size:14.5px;color:rgba(255,255,255,.66);font-weight:600;margin-top:5px;}
.nag{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--acc-soft);border:1.5px solid var(--acc);border-radius:16px;padding:12px 14px;font-weight:600;font-size:14.5px;margin-bottom:12px;}
.nag b{background:var(--acc);color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;flex:none;}
.last{color:var(--muted);font-size:14px;font-weight:600;margin:4px 4px 14px;}
.last b{color:var(--text);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gbtn{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;min-height:94px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .12s;}
.gbtn:active{transform:scale(.97);}
.gbtn.wide{grid-column:1/-1;min-height:76px;}
.gbtn b{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.gbtn span{color:var(--muted);font-size:13.5px;font-weight:600;}

/* Тренировка */
.wbar{height:6px;border-radius:3px;background:var(--tile2);margin-top:12px;overflow:hidden;}
.wbar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .35s;}
.item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;transition:transform .12s;}
.item:active{transform:scale(.985);}
.ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line2);flex:none;display:grid;place-items:center;}
.ck svg{width:17px;height:17px;}
.item.done .ck{background:var(--ink);border-color:var(--ink);color:#fff;}
.item.pop .ck{animation:ckpop .42s ease;}
@keyframes ckpop{0%{transform:scale(.5);}55%{transform:scale(1.22);}100%{transform:scale(1);}}
.it-n{display:block;font-weight:700;font-size:17px;letter-spacing:-.01em;}
.it-s{display:block;color:var(--muted);font-size:14.5px;font-weight:600;margin-top:3px;}
.item.done .it-s{color:var(--text);}
.it-note{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;background:var(--acc-soft);padding:3px 8px;border-radius:8px;}
.tag{font-size:11.5px;font-weight:800;background:var(--acc-soft);color:var(--acc-text);padding:4px 8px;border-radius:8px;flex:none;}
.tag.pain{background:var(--pain);color:#fff;}
.it-note.pain,.pnote.pain{background:var(--pain-soft);color:var(--pain-text);}
.daychip{display:inline-block;font-size:14px;font-weight:700;background:var(--card);padding:11px 14px;border-radius:12px;margin:0 0 12px;}
.addex{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:var(--r);border:2px dashed var(--line2);color:var(--muted);font-weight:700;margin-top:4px;}
.addex svg{width:20px;height:20px;}
.btn-black.ready{background:var(--acc);}

/* Шторка */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:8px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;}
.sheet.on{transform:none;}
.sh-top{display:flex;align-items:center;gap:8px;margin:0 -6px 6px;}
.sh-top .side{width:44px;flex:none;display:flex;}
.sh-top .side.r{justify-content:flex-end;}
.sh-x{width:40px;height:40px;border-radius:50%;background:var(--tile);display:grid;place-items:center;color:var(--text);}
.sh-x svg{width:18px;height:18px;}
.grip{flex:1;height:40px;display:block;}
.grip::after{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto;}
.segs{display:flex;gap:4px;margin:2px 0 14px;}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--tile2);display:block;}
.segs i.done{background:var(--ink);}
.segs i.cur{background:var(--acc);}
.plan{font-weight:700;font-size:15px;margin-top:8px;}
.pnote{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;background:var(--acc-soft);padding:4px 9px;border-radius:8px;}
.tip{color:var(--muted);font-size:14px;font-weight:600;margin-top:6px;}
.lastp{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:8px;}
.cols,.srow{display:grid;grid-template-columns:26px 1fr 1fr;gap:10px;align-items:center;}
.cols.one,.srow.one{grid-template-columns:26px 1fr;}
.cols{margin:18px 0 8px;color:var(--muted);font-size:13px;font-weight:700;}
.cols span{padding-left:6px;}
.srow{margin-bottom:10px;}
.sn{color:var(--muted2);font-weight:800;font-size:17px;text-align:center;}
.tile{height:74px;border-radius:20px;background:var(--tile);font-size:34px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.tile small{font-size:16px;color:var(--muted);font-weight:700;margin:12px 0 0 2px;}
.tile.on{background:var(--ink);color:#fff;}
.tile.on small{color:rgba(255,255,255,.6);}
.tile.over{box-shadow:inset 0 0 0 3px var(--red);}
.addset{grid-column:2/-1;height:62px;border-radius:20px;background:var(--tile);font-weight:700;font-size:16px;}
.rmset{display:block;margin:0 0 0 36px;color:var(--muted);font-weight:700;font-size:14px;padding:12px 0;}
.painbtn{display:inline-block;margin:6px 0 0 36px;padding:12px 16px;border-radius:13px;background:var(--tile);font-weight:700;font-size:15px;text-align:left;}
.painbtn.on{background:var(--pain-soft);color:var(--pain-text);}
.sh-foot{display:flex;gap:10px;align-items:center;margin-top:14px;position:sticky;bottom:0;background:var(--card);padding:8px 0 2px;}
.round{width:62px;height:62px;border-radius:50%;background:var(--tile);display:grid;place-items:center;flex:none;}
.round svg{width:24px;height:24px;}
.btn-black{flex:1;height:62px;border-radius:31px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;transition:transform .12s,background .2s;}
.btn-black:active,.btn-tile:active{transform:scale(.97);}
.btn-black.danger{background:var(--red);}
.btn-tile{flex:1;height:62px;border-radius:31px;background:var(--tile);font-weight:800;font-size:17px;}
.row2{display:flex;gap:10px;margin-top:18px;}
.kp{width:100%;}
.kp-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.kp-top button{width:80px;height:56px;border-radius:16px;background:var(--tile);font-weight:800;font-size:17px;}
.kp-val{flex:1;text-align:center;font-size:38px;font-weight:800;letter-spacing:-.02em;}
.kp-val small{font-size:16px;color:var(--muted);margin-left:4px;}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.kp-grid button{height:54px;border-radius:14px;background:var(--tile);font-size:25px;font-weight:700;}
.kp-grid button:active,.kp-top button:active{background:var(--tile2);}
.kp .btn-black{width:100%;}

/* Списки */
.mh{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px;}
.mh:first-child{margin-top:6px;}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);padding:13px 15px;border-radius:16px;margin-bottom:8px;}
.row .d{width:42px;flex:none;text-align:center;}
.row .d b{display:block;font-size:21px;font-weight:800;line-height:1.05;}
.row .d span{font-size:12px;color:var(--muted);font-weight:700;}
.row .t{font-weight:700;font-size:15.5px;}
.row .s{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px;}
.row .r{color:var(--muted);font-weight:700;font-size:14px;flex:none;text-align:right;}
.row .ban{color:var(--red);font-size:12.5px;font-weight:700;margin-top:3px;}
.sx{margin:16px 0 4px;}
.sx .xn{font-weight:700;}
.sx .xs{color:var(--muted);font-weight:600;font-size:14.5px;margin-top:2px;}

/* Графики */
.seg{display:flex;background:var(--tile);border-radius:14px;padding:4px;margin:16px 0 14px;}
.seg button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);}
.seg button.on{background:var(--ink);color:#fff;}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.st{background:var(--tile);border-radius:18px;padding:14px 16px;}
.st b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
.st span{font-size:13px;color:var(--muted);font-weight:700;}
.st em{font-style:normal;background:var(--ink);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;margin-right:6px;}
.chart{width:100%;height:150px;display:block;margin:18px 0 6px;}
.chart .s1{fill:none;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke;}
.chart .s2{fill:none;stroke:var(--muted2);stroke-width:2.5;vector-effect:non-scaling-stroke;}
.chart .area{fill:var(--tile);}
.chart .s1d{fill:var(--ink);} .chart .s2d{fill:var(--muted2);}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:700;}
.legend{display:flex;gap:16px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
.hist{display:flex;gap:20px;overflow-x:auto;margin-top:10px;padding-bottom:4px;}
.hc{flex:none;font-weight:700;font-size:15px;line-height:1.6;}
.hc .hd{color:var(--muted);font-size:13px;margin-bottom:2px;white-space:nowrap;}
.dots i.on.c{background:var(--acc-soft);box-shadow:inset 0 0 0 2.5px var(--acc);}
.week.closed .dots i.on.c{background:var(--acc);box-shadow:none;}
.plan-s.done{opacity:.5;}
.plan-s.next{box-shadow:inset 0 0 0 2.5px var(--acc);}
.ps-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
.ps-h b{font-size:16px;font-weight:800;}
.ps-h span{color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;}
.plan-s.next .ps-h span{color:var(--acc-text);}
.ps-i{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;}
.ps-i span:first-child{font-weight:600;}
.ps-i span:last-child{color:var(--muted);font-weight:700;text-align:right;}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pain);margin-right:5px;vertical-align:1px;}

/* Итог, прогресс, достижения */
.done-hero{text-align:center;padding:2px 0 2px;}
.done-hero .ok{width:68px;height:68px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 12px;animation:ckpop .5s ease;}
.done-hero .ok svg{width:34px;height:34px;}
.feel{margin-top:18px;}
.feel-q{font-weight:800;font-size:17px;text-align:center;margin-bottom:10px;}
.feel-row{display:flex;gap:8px;}
.feel-row button{flex:1;height:54px;border-radius:16px;background:var(--tile);font-weight:800;font-size:15.5px;transition:transform .12s;}
.feel-row button:active{transform:scale(.96);}
.feel-row button.on{background:var(--ink);color:#fff;}
.hls{margin-top:14px;}
.hl{display:flex;gap:10px;align-items:flex-start;background:var(--tile);border-radius:14px;padding:11px 14px;margin-top:8px;font-weight:600;font-size:15px;line-height:1.35;}
.hl b{font-weight:800;}
.hl .ic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--ink);color:#fff;margin-top:-1px;}
.hl .ic svg{width:13px;height:13px;}
.hl.acc{background:var(--acc-soft);} .hl.acc .ic{background:var(--acc);}
.hl.pain{background:var(--pain-soft);color:var(--pain-text);} .hl.pain .ic{background:var(--pain);}
.hl.dim{color:var(--muted);} .hl.dim .ic{background:var(--tile2);color:var(--muted);}
.hl.medal .ic{width:30px;height:30px;background:none;margin:-4px 0 -4px -4px;} .hl.medal .ic svg{width:30px;height:30px;}
.ach-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px;}
.ach-top .st b{font-size:26px;}
.ach{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);}
.ach:last-of-type{border-bottom:0;}
.ach .badge{width:46px;height:46px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;letter-spacing:-.02em;}
.ach .badge.off{background:var(--tile);color:var(--muted2);}
.ach .an{font-weight:800;font-size:16px;}
.ach .ad{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px;}
.ach .nx{color:var(--muted);font-size:12.5px;font-weight:700;margin-top:3px;}

/* Формы и данные */
.form label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 6px;}
.form input{width:100%;height:52px;border-radius:14px;border:0;background:var(--tile);padding:0 14px;font-size:18px;font-weight:700;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:11px 14px;border-radius:12px;background:var(--tile);font-weight:700;font-size:14px;}
.chip.on{background:var(--ink);color:#fff;}
.search{width:100%;height:50px;border-radius:14px;border:0;background:var(--tile);padding:0 14px;font-size:17px;font-weight:600;outline:none;margin:6px 0 4px;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;}
.kv:last-child{border-bottom:0;}
.kv span{color:var(--muted);font-weight:600;}
.kv b{font-weight:700;text-align:right;}
.big-btn{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:29px;background:var(--ink);color:#fff;font-weight:800;font-size:17px;margin-top:12px;}
.big-btn.tile{background:var(--card);color:var(--text);}
.weight-big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
.weight-big small{font-size:20px;color:var(--muted);margin-left:4px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.pill{background:var(--tile);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;}
.delta{color:var(--muted);font-weight:700;font-size:14px;margin-top:4px;}

.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90;}
/* медали: у каждой серии свой цвет, форма растет с уровнем */
.bdg{display:block;flex:none;}
.badges{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:8px -2px 0;}
.badges button{flex:none;display:block;width:56px;height:56px;transition:transform .12s;}
.badges button:active{transform:scale(.92);}
.ach-h .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px;}
.ach-s{padding:14px 0 12px;border-bottom:1px solid var(--line);}
.ach-s:last-of-type{border-bottom:0;}
.ach-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.ach-h b{font-size:16px;font-weight:800;}
.ach-h span{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;}
.ach-n{color:var(--muted);font-size:13px;font-weight:700;margin-top:6px;}
.near{display:flex;gap:12px;align-items:center;padding:10px 0;}
.near .grow b{display:block;font-size:15px;font-weight:800;}
.near .grow span{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-top:2px;}
.bar{height:7px;border-radius:4px;background:var(--tile2);margin-top:7px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc);}
.minib{display:flex;align-items:center;}
.minib .bdg{margin-left:-8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12));}
.minib .bdg:first-child{margin-left:0;}
.gbtn.wide{flex-direction:row;align-items:center;}
.cardio-link{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px 4px;color:var(--muted);font-weight:700;font-size:14px;}
.cardio-link b{color:var(--text);font-weight:800;}
/* открытие новой медали */
.reveal{position:fixed;inset:0;z-index:85;background:rgba(20,20,20,.55);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s cubic-bezier(.3,0,1,1);}
.reveal.on{opacity:1;pointer-events:auto;transition-timing-function:cubic-bezier(.2,0,0,1);}
.rv-card{width:min(340px,88vw);background:var(--card);border-radius:28px;padding:26px 22px 16px;text-align:center;position:relative;overflow:hidden;opacity:0;transform:translateY(16px);
  transition:opacity .3s cubic-bezier(.05,.7,.1,1),transform .3s cubic-bezier(.05,.7,.1,1);}
.reveal.on .rv-card{opacity:1;transform:none;}
.rv-rays{position:absolute;left:50%;top:94px;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(242,95,12,.16) 0deg 9deg,transparent 9deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);}
.reveal.on .rv-rays{animation:rays 2.4s cubic-bezier(.2,0,0,1) .3s both;}
@keyframes rays{0%{opacity:0;transform:rotate(0);}17%{opacity:1;}100%{opacity:1;transform:rotate(24deg);}}
.rv-badge{position:relative;width:136px;height:136px;margin:4px auto 14px;opacity:0;}
.reveal.on .rv-badge{animation:bdgpop .65s cubic-bezier(.2,1.4,.4,1) .1s both;
  animation-timing-function:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);}
@keyframes bdgpop{0%{transform:scale(.4);opacity:0;}20%{opacity:1;}100%{transform:none;opacity:1;}}
/* блик по медали один раз */
.rv-badge::after{content:"";position:absolute;inset:7%;border-radius:50%;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%) no-repeat;background-size:250% 100%;background-position:160% 0;}
.reveal.on .rv-badge::after{animation:glint .6s cubic-bezier(.4,0,.2,1) .75s both;}
@keyframes glint{0%{opacity:1;background-position:160% 0;}99%{opacity:1;}100%{opacity:0;background-position:-60% 0;}}
.rv-k{position:relative;font-size:12.5px;font-weight:800;color:var(--acc-text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.rv-card .h2,.rv-card .sub,.rv-more{position:relative;}
.reveal.on .rv-k{animation:fadeup .24s cubic-bezier(.05,.7,.1,1) .45s both;}
.reveal.on .rv-card .h2{animation:fadeup .24s cubic-bezier(.05,.7,.1,1) .51s both;}
.reveal.on .rv-card .sub{animation:fadeup .24s cubic-bezier(.05,.7,.1,1) .57s both;}
.reveal.on .rv-more{animation:fadeup .24s cubic-bezier(.05,.7,.1,1) .6s both;}
.reveal.on .big-btn{animation:fadein .2s ease .65s both;}
@keyframes fadeup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.rv-more{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left;}
.rv-m{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;background:var(--tile);border-radius:14px;padding:6px 12px 6px 6px;}
.rv-m span{flex:1;min-width:0;}
.reveal .big-btn{position:relative;margin-top:18px;}
@media (prefers-reduced-motion: reduce){
  .reveal .rv-card{transform:none!important;transition:opacity .2s!important;}
  .reveal.on .rv-card *{animation:none!important;opacity:1;}
  .reveal.on .rv-card .rv-rays{opacity:.6;}
  .rv-badge::after{display:none;}
  .done-hero .ok,.item.pop .ck{animation:none!important;}
}
.bhero{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.bhero .seg{margin:0 0 16px;}
.bk{color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.bmain{display:flex;align-items:baseline;gap:10px;margin-top:4px;}
.bmain b{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
.bmain span{color:var(--muted);font-weight:700;font-size:15px;}
.good{color:var(--good)!important;} .bad{color:var(--bad)!important;} .flat{color:var(--muted)!important;}
.bsub{color:var(--muted);font-size:14px;font-weight:600;margin-top:4px;line-height:1.4;}
.b2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.b2 .st b{font-size:24px;}
.b2 .st i{display:block;font-style:normal;color:var(--muted);font-size:12.5px;font-weight:700;margin-top:2px;}
.nextw{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;}
.nextw b{display:block;font-weight:800;font-size:15.5px;}
.nextw span{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-top:2px;}
.nextw.due{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc);}
.nextw .cta-mini{flex:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;}
.nextw.due .cta-mini{background:var(--acc);}
.vals{display:flex;justify-content:space-between;color:var(--text);font-size:14px;font-weight:800;margin-top:2px;}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:13px 16px;border-radius:14px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:70;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
/* пока открыта шторка, подсказка появляется сверху и не закрывает ее кнопки */
.toast.top{top:calc(var(--safe-t) + 12px);bottom:auto;transform:translate(-50%,-16px);}
.toast.top.on{transform:translate(-50%,0);}
.toast button{color:var(--acc);font-weight:800;padding:4px 0;flex:none;}
</style>

<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="scrim" id="scrim" data-a="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="reveal" id="reveal" data-a="revealNext"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
const VERSION='v7';
const LS_KEY='podhod.state.v1';
const GROUPS=['Грудь','Спина','Ноги','Плечи','Руки','Пресс','Кардио','Растяжка','Другое'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_S=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MON_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WD_L=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-6M12 20V8M19 20V11"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.3 2c.5 3-1.1 4.9-2.7 6.7C8 10.5 6.3 12.4 6.3 15.4a5.7 5.7 0 0 0 11.4 0c0-2.5-1.2-4.3-2.6-5.6.1 1.5-.5 2.7-1.5 3.3.3-3.5-.6-7.4-1.3-11.1z"/></svg>',
};

//==================== УТИЛИТЫ ====================
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pday=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
let TODAY=null;                                   // подмена даты только для тестов
const today=()=>TODAY||dkey(new Date());
const ddiff=(a,b)=>Math.round((pday(b)-pday(a))/864e5);
const addDays=(k,n)=>{const d=pday(k);d.setDate(d.getDate()+n);return dkey(d);};
const wkStart=k=>{const d=pday(k);d.setDate(d.getDate()-(d.getDay()+6)%7);return dkey(d);};
const curYear=()=>pday(today()).getFullYear();
function fday(k,wd){const d=pday(k);let s=d.getDate()+' '+MON[d.getMonth()];if(d.getFullYear()!==curYear())s+=' '+d.getFullYear();if(wd)s+=', '+WD[d.getDay()];return s;}
function fdayS(k){const d=pday(k);return d.getDate()+' '+MON_S[d.getMonth()]+(d.getFullYear()!==curYear()?' '+String(d.getFullYear()).slice(2):'');}
const round2=x=>Math.round(x*100)/100;
const fnum=x=>x==null||isNaN(x)?'—':String(round2(x)).replace('.',',');
const fbig=x=>Math.round(x).toLocaleString('ru-RU');
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c;}
const pl=(n,a,b,c)=>n+' '+plural(n,a,b,c);
const minsSince=t=>Math.max(0,Math.round((Date.now()-t)/60000));
function fdur(m){return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин';}

//==================== ХРАНИЛИЩЕ ====================
// Основное: IndexedDB. Запасная копия: localStorage. Раз в день снимок (храним 7).
let S=null, db=null, saveT=null, storageOk=true, snapDone=null;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('podhod',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
function tx(mode,fn){return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const kvGet=k=>tx('readonly',s=>s.get(k));
const kvPut=(k,v)=>tx('readwrite',s=>s.put(v,k));
const kvDel=k=>tx('readwrite',s=>s.delete(k));
const kvKeys=()=>tx('readonly',s=>s.getAllKeys());
function blank(){return {app:'podhod',v:1,exercises:[],sessions:[],programs:[],activeProgram:null,weighins:[],active:null,meta:{created:Date.now(),lastBackupAt:null,savedAt:0,deleted:[]}};}
function sortSessions(s){s.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start||0)-(b.start||0));}
function normalize(s){
  const b=blank();
  s=Object.assign(b,s&&typeof s==='object'?s:{});
  s.meta=Object.assign(blank().meta,s.meta||{});
  for(const k of ['exercises','sessions','programs','weighins'])if(!Array.isArray(s[k]))s[k]=[];
  if(!Array.isArray(s.meta.deleted))s.meta.deleted=[];
  sortSessions(s);
  s.weighins.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return s;
}
async function load(){
  let raw=null;
  try{db=await idbOpen();raw=await kvGet('state');}catch(e){db=null;}
  if(!raw){try{raw=localStorage.getItem(LS_KEY);}catch(e){}}
  let s=null;try{s=raw?JSON.parse(raw):null;}catch(e){s=null;}
  S=normalize(s);EXI=null;
  if(raw&&S.sessions.length)snapshot(raw);
}
function save(){S.meta.savedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(flush,120);}
async function flush(){
  clearTimeout(saveT);saveT=null;
  const json=JSON.stringify(S);let ok=false;
  try{localStorage.setItem(LS_KEY,json);ok=true;}catch(e){}   // синхронно: успевает даже при сворачивании
  if(db){try{await kvPut('state',json);ok=true;}catch(e){}}
  if(storageOk!==ok){storageOk=ok;render();}
}
async function snapshot(json){
  const k='snap:'+today();
  if(!db||snapDone===k)return;
  try{
    const keys=(await kvKeys()).filter(x=>String(x).startsWith('snap:')).sort();
    if(!keys.includes(k)){await kvPut(k,json);keys.push(k);}
    snapDone=k;
    for(const old of keys.slice(0,Math.max(0,keys.length-7)))await kvDel(old);
  }catch(e){}
}
function askPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)flush();});
window.addEventListener('pagehide',()=>{if(saveT)flush();});

//==================== ДАННЫЕ ====================
let EXI=null;
function ex(id){if(!EXI)EXI=new Map(S.exercises.map(e=>[e.id,e]));return EXI.get(id)||{id,name:'Упражнение',group:'Другое',kind:'w',step:2.5};}
const prog=()=>S.programs.find(p=>p.id===S.activeProgram)||null;
const perWeek=()=>(prog()&&prog().perWeek)||2;
const topW=sets=>sets.reduce((a,s)=>Math.max(a,s.w||0),0);
const vol=(sets,e)=>sets.reduce((a,s)=>a+(s.w||0)*(s.r||0),0)*(e&&e.x2?2:1);
const sessVol=s=>s.items.reduce((a,it)=>a+vol(it.sets,ex(it.ex)),0);
function ftime(t,e){if(t==null)return '—';if(e&&e.tu==='sec')return t+' сек';if(t>=60)return fnum(round2(t/60))+' мин';return t+' сек';}
function fset(s,e){
  if(s.t!=null)return ftime(s.t,e)+(s.d?' / '+fnum(s.d)+' км':'');
  if(s.w>0)return fnum(s.w)+'×'+(s.r||0);
  return (s.r||0)+' повт.';
}
const fsets=(sets,e)=>sets.map(s=>fset(s,e)).join(' · ');
function lastPerf(exId){                  // последний раз, когда были подходы
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i],it=s.items.find(x=>x.ex===exId&&x.sets&&x.sets.length);
    if(it)return {s,it};
  }
  return null;
}
function lastItem(exId){                  // последний раз в тренировке, в том числе «болело» без подходов
  for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i],it=s.items.find(x=>x.ex===exId);if(it)return {s,it};}
  return null;
}
function roundStep(w,step){step=step||2.5;return Math.max(0,round2(Math.round(w/step)*step));}
// Цель на сегодня. Повторяем лесенку прошлого раза (например 45 → 49 → 54), а не ставим все подходы
// на верхний вес. Все подходы сделаны → +шаг только на самом тяжелом. Перерыв → снижаем все подходы.
// «Тяжело» → без прибавки. «Болело» → каждый подход на шаг ниже, чем в тот раз. Потолок — на каждый подход.
function lastLadder(ws,n){const b=ws.slice(-n).map(s=>s.w);while(b.length<n)b.push(b[b.length-1]);return b;}
function target(item,p){
  const e=ex(item.ex),n=item.sets||3,step=e.step||2.5;
  const reps=Array.isArray(item.reps)?item.reps:[item.reps||10,item.reps||10];
  const t={n,rmin:reps[0],rmax:reps[1],w:item.w||0,wmin:item.w||0,t:item.t==null?null:item.t,note:'',flag:''};
  const lp=lastPerf(item.ex),li=lastItem(item.ex),pain=!!(li&&li.it.pain),notes=[];
  const ws=lp?lp.it.sets.filter(s=>(s.r||0)>0&&(s.w||0)>0):[],top=topW(ws);
  let W=Array.from({length:n},()=>t.w);
  if(e.kind==='w'&&lp&&p&&lp.s.date>=p.from&&ws.length){
    const base=lastLadder(ws,n),gap=ddiff(lp.s.date,today());
    const hit=ws.length>=n&&ws.every(s=>s.r>=t.rmax);
    W=base.slice();
    if(gap>21){W=base.map(w=>roundStep(w*(gap>42?.65:.8),step));notes.push(`Перерыв ${pl(gap,'день','дня','дней')}: вес снижен`);t.flag='gap';}
    else if(hit&&!pain&&lp.s.feel==='hard'){notes.push('В прошлый раз было тяжело: вес тот же');t.flag='hard';}
    else if(hit&&!pain){const mx=Math.max(...base);W=base.map(w=>w===mx?round2(w+step):w);notes.push('Прибавка: в прошлый раз все подходы сделаны');t.flag='up';}
  }
  if(pain){
    if(e.kind==='w'&&top>0){const src=lastLadder(ws,n);W=W.map((w,i)=>Math.min(w,Math.max(0,round2(src[i]-step))));notes.unshift('В прошлый раз болело: вес на шаг ниже');}
    else notes.unshift('В прошлый раз болело: делай аккуратно');
    t.flag='pain';
  }

// Рост с прошлого раза: вес, повторы на том же весе, время.
function growth(now,prev,e){
  const tN=topW(now),tP=topW(prev);
  if(tN>0&&tP>0){
    if(tN>tP)return `${fnum(tP)} → ${fnum(tN)} кг`;
    if(tN===tP){const rN=now.filter(s=>s.w===tN).reduce((a,s)=>a+(s.r||0),0),rP=prev.filter(s=>s.w===tP).reduce((a,s)=>a+(s.r||0),0);
      if(rN>rP)return `+${pl(rN-rP,'повтор','повтора','повторов')} на ${fnum(tN)} кг`;}
    return '';
  }
  if(!tN&&!tP){
    const xN=Math.max(0,...now.map(s=>s.t||0)),xP=Math.max(0,...prev.map(s=>s.t||0));
    if(xN&&xP)return xN>xP?`${ftime(xP,e)} → ${ftime(xN,e)}`:'';
    const rN=now.reduce((a,s)=>a+(s.r||0),0),rP=prev.reduce((a,s)=>a+(s.r||0),0);
    if(rP>0&&rN>rP)return `+${pl(rN-rP,'повтор','повтора','повторов')}`;
  }
  return '';
}
function allTimeTop(exId){let m=0;for(const o of S.sessions)for(const x of o.items)if(x.ex===exId)m=Math.max(m,topW(x.sets));return m;}

//==================== ТРЕНИРОВКА ====================
function buildItems(day,p){

// Программа «через день» хранит все занятия заранее с точными весами (p.plan). Идут по порядку, не по датам:
// пропустил день — следующее занятие по порядку.
const isPlan=p=>!!(p&&Array.isArray(p.plan)&&p.plan.length);

  const ss=S.sessions.filter(s=>s.prog===p.id),last=ss[ss.length-1];

function nextUp(p){

  const d=p.cycle?cycleNext(p):nextDay(p);

// В прошлый раз все подходы сделаны? Сверяем с целью, которую тогда ставило приложение.

  if(tgt&&tgt.length)return tgt.every((t,i)=>t.r==null||(done[i]&&done[i].r>=t.r));

// Вес из плана ставим как есть, но со страховкой: не добрал повторы, «тяжело» или был перерыв 7–21 день →
// вес как в прошлый раз (сверяем каждый подход лесенки), «болело» → на шаг ниже, перерыв больше 3 недель → ниже,
// потолок — всегда.
function planItem(it,p){
  const e=ex(it.ex),plan=(it.sets||[]).map(x=>Object.assign({},x)),notes=[];
  let sets=plan.map(x=>Object.assign({},x)),flag='';
  const lp=lastPerf(it.ex),li=lastItem(it.ex),pain=!!(li&&li.it.pain);
  if(e.kind==='w'&&plan.some(x=>(x.w||0)>0)){
    const step=e.step||2.5,ws=lp?lp.it.sets.filter(x=>(x.r||0)>0&&(x.w||0)>0):[],lastTop=topW(ws),planTop=topW(plan);
    if(lp&&ws.length){
      const gap=ddiff(lp.s.date,today()),prev=lastLadder(ws,plan.length),up=plan.some((x,i)=>(x.w||0)>prev[i]);
      // самый длинный перерыв между походами с прошлого раза до сегодня
      const vis=S.sessions.filter(s=>s.date>=lp.s.date).map(s=>s.date).concat(today()).sort();
      let away=0;for(let i=1;i<vis.length;i++)away=Math.max(away,ddiff(vis[i-1],vis[i]));

}

let ed=null; // {row,f,buf,fresh}
function colsFor(e){
  if(e.kind==='time')return [{f:'t',l:e.tu==='sec'?'секунды':'минуты'}].concat(e.dist?[{f:'d',l:'км'}]:[]);
  return [{f:'w',l:'вес'},{f:'r',l:'повторы'}];
}
function fieldVal(st,f,e){
  if(f==='t')return st.t==null?0:(e.tu==='sec'?st.t:round2(st.t/60));
  if(f==='d')return st.d||0;
  return st[f]||0;
}
function stepOf(f,e){return f==='w'?(e.step||2.5):f==='r'?1:f==='d'?.5:(e.tu==='sec'?5:1);}
function tileHTML(st,c,ri,e){
  const on=ed&&ed.row===ri&&ed.f===c.f;

  if(c.f==='w'){if(!v)txt='—';else if(e.x2)small='<small>×2</small>';}
  if(c.f==='d'&&!v)txt='—';

function keypadHTML(e){

function applyField(st,f,v,e){

let statsEx=null,statsPer='y';
function exPoints(exId){
  const pts=[];
  for(const s of S.sessions){
    const sets=[].concat(...s.items.filter(x=>x.ex===exId).map(x=>x.sets));
    if(!sets.length)continue;
    pts.push({date:s.date,sets,pain:s.items.some(x=>x.ex===exId&&x.pain),vol:vol(sets,ex(exId)),top:topW(sets),maxR:sets.reduce((a,x)=>Math.max(a,x.r||0),0),
      sumR:sets.reduce((a,x)=>a+(x.r||0),0),maxT:sets.reduce((a,x)=>Math.max(a,x.t||0),0),maxD:sets.reduce((a,x)=>Math.max(a,x.d||0),0)});
  }
  return pts;
}
function byMonth(pts,keys){          // много точек → максимум за месяц, чтобы тренд читался
  if(pts.length<=36)return pts;
  const m=new Map();
  for(const p of pts){const k=p.date.slice(0,7),o=m.get(k);
    if(!o)m.set(k,Object.assign({},p));else for(const x of keys)o[x.k]=Math.max(o[x.k]||0,p[x.k]||0);}
  return [...m.values()];
}
function chartSVG(pts,keys){
  pts=byMonth(pts,keys);
  const W=320,H=150,P=8,n=pts.length;
  if(!n)return '<div class="empty">Нет данных за этот период</div>';
  const xs=pts.map((_,i)=>n===1?W/2:P+(W-2*P)*i/(n-1));
  let area='',lines='';
  keys.forEach(k=>{
    const vals=pts.map(p=>p[k.k]||0),mn=Math.min(...vals),mx=Math.max(...vals);
    const ys=vals.map(v=>mx===mn?H*.45:H-P-(H-2*P-12)*(v-mn)/(mx-mn));
    let d=`M${xs[0].toFixed(1)},${ys[0].toFixed(1)}`;
    for(let i=1;i<n;i++){const c=((xs[i-1]+xs[i])/2).toFixed(1);d+=` C${c},${ys[i-1].toFixed(1)} ${c},${ys[i].toFixed(1)} ${xs[i].toFixed(1)},${ys[i].toFixed(1)}`;}
    if(n===1){lines+=`<circle cx="${xs[0]}" cy="${ys[0].toFixed(1)}" r="4" class="${k.c}d"/>`;return;}
    if(k.area)area+=`<path class="area" d="${d} L${xs[n-1].toFixed(1)},${H} L${xs[0].toFixed(1)},${H} Z"/>`;
    lines=(k.c==='s1'?lines+`<path class="s1" d="${d}"/>`:`<path class="s2" d="${d}"/>`+lines);
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${area}${lines}</svg>
    <div class="axis"><span>${fdayS(pts[0].date)}</span><span>${n>1?fdayS(pts[n-1].date):''}</span></div>`;
}

function weekCard(w){
  const closed=w.closed,need=Math.max(0,w.per-w.now),noStr=w.visits&&w.st<w.minStrength&&w.now>=w.per-1;
  const marks=w.marks.slice(0,Math.max(w.per,w.marks.length));
  const dots=marks.map(m=>`<i class="on${m==='c'?' c':''}"></i>`).join('')+Array.from({length:Math.max(0,w.per-marks.length)},()=>'<i></i>').join('');
  const unit=n=>w.visits?plural(n,'поход','похода','походов'):plural(n,'тренировка','тренировки','тренировок');
  const t=closed?'Неделя закрыта':`Неделя: ${w.now} из ${w.per}`;
  let s;
  if(closed)s=w.streak>1?`${pl(w.streak,'неделя','недели','недель')} подряд`:'Первая неделя серии';
  else if(!need&&noStr)s='Для закрытия недели нужна силовая';
  else if(noStr)s=`Еще ${need} ${unit(need)}, и это силовая`;
  else s=`Еще ${need} ${unit(need)}${w.streak>0?`, и серия станет ${w.streak+1}`:' до закрытия недели'}`;
  let left;
  if(!closed)left=w.left===0?'сегодня последний день недели':'осталось '+pl(w.left+1,'день','дня','дней');
  else{const best=achCompute().best.streak;
    left=w.streak>=2&&w.streak>=best?'это рекорд серии':best>w.streak?'рекорд серии: '+pl(best,'неделя','недели','недель'):'';}
  return `<div class="card weekcard" data-a="ach" role="button" aria-label="Прогресс и достижения">
    <div class="week${closed?' closed':''}"><div class="dots">${dots}</div>
      <div class="grow"><div class="wk-t">${t}</div><div class="wk-s">${s}</div></div>
      ${w.streak>0?`<span class="flame">${ICON.flame}${w.streak}</span>`:''}<span class="chev">${ICON.chev}</span></div>
    <div class="chain">${weekChain(12).map(c=>`<i class="${c.on?'on':''}${c.cur?' cur':''}"></i>`).join('')}</div>
    <div class="chain-l"><span>12 недель</span><span>${left}</span></div></div>`;
}

        <span>${isDone?'✓ сделано':isNext?'следующая':'ориентир '+WD[d.getDay()]+' '+fdayS(e.date)}</span></div>
        ${e.items.map(it=>{const x=ex(it.ex);return `<div class="ps-i"><span>${esc(x.name)}</span><span>${esc(fsetsPlan(it.sets,x))}</span></div>`;}).join('')}
        ${e.note?`<div class="hint">${esc(e.note)}</div>`:''}</div>`;
    }
    if(p.note)b+=`<div class="mh">О плане</div><div class="card"><p class="hint" style="margin:0">${esc(p.note)}</p></div>`;
    if(p.rules&&p.rules.length)b+=`<div class="mh">Правила</div><div class="card">${p.rules.map(r=>`<p class="hint" style="margin:4px 0">• ${esc(r)}</p>`).join('')}</div>`;
    return {head:subHead(p.title,`${done.size} из ${p.plan.length} по плану`),body:b};
  }
  const nd=nextDay(p);
  let b=`<div class="card"><div class="kv"><span>С</span><b>${fday(p.from)}</b></div><div class="kv"><span>Тренировок в неделю</span><b>${p.perWeek}</b></div>
    ${p.note?`<p class="hint">${esc(p.note)}</p>`:''}</div>`;
  for(const d of p.days){
    b+=`<div class="mh">${esc(d.title)}${d.code===nd.code?' · следующая':''}</div><div class="card">`;
    for(const it of d.items){const e=ex(it.ex),t=target(it,p);
      b+=`<div class="sx" style="margin:6px 0 12px"><div class="xn">${esc(e.name)}${it.req?' <span class="tag">обязательно</span>':''}</div>
        <div class="xs">${esc(planText({n:t.n,rmin:t.rmin,rmax:t.rmax,w:t.w,wmin:t.wmin,t:t.t},e))}${t.note?' · '+esc(t.note):''}</div>
        ${it.note?`<div class="xs">${esc(it.note)}</div>`:''}</div>`;}
    b+='</div>';
  }
  return {head:subHead(p.title,`${pl(p.perWeek,'тренировка','тренировки','тренировок')} в неделю`),body:b};
};

async function fillData(){
  const el=$('#persist');
  if(el){let p=null;try{p=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null;}catch(e){}
    el.textContent=p===true?'включена':p===false?'не включена':'неизвестно';}
  const sn=$('#snaps');if(!sn)return;
  let keys=[];try{if(db)keys=(await kvKeys()).filter(k=>String(k).startsWith('snap:')).sort().reverse();}catch(e){}

function render(){

//==================== БЭКАП И ИМПОРТ ====================
const backupJSON=()=>JSON.stringify(Object.assign({},S,{exportedAt:Date.now(),appVersion:VERSION}));
async function exportBackup(){
  const name=`podhod-${today()}.json`,blob=new Blob([backupJSON()],{type:'application/json'});
  let file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});markBackup('Бэкап сохранен');return;}
    catch(e){if(e&&e.name==='AbortError'){toast('Бэкап не сохранен');return;}}
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    markBackup('Файл бэкапа сохранен');
  }catch(e){toast('Не получилось сохранить файл');}
}
function markBackup(msg){S.meta.lastBackupAt=Date.now();save();render();if(stack.length)renderSheet(true);toast(msg);}
function mergeAll(d){
  const r={sessions:0,exercises:0,programs:0,weighins:0};
  for(const e of d.exercises||[]){if(!e||!e.id)continue;const i=S.exercises.findIndex(x=>x.id===e.id);
    if(i<0){S.exercises.push(e);r.exercises++;}else S.exercises[i]=Object.assign({},S.exercises[i],e);}
  EXI=null;
  const have=new Set(S.sessions.map(s=>s.id)),del=new Set(S.meta.deleted);
  for(const s of d.sessions||[]){if(!s||!s.id||have.has(s.id)||del.has(s.id)||!Array.isArray(s.items))continue;S.sessions.push(s);have.add(s.id);r.sessions++;}
  for(const p of d.programs||[]){if(!p||!p.id)continue;const i=S.programs.findIndex(x=>x.id===p.id);
    if(i<0){S.programs.push(p);r.programs++;}else S.programs[i]=p;}
  if(d.activeProgram&&!prog())S.activeProgram=d.activeProgram;
  const wh=new Set(S.weighins.map(w=>w.id));
  for(const w of d.weighins||[]){if(!w||!w.id||wh.has(w.id))continue;S.weighins.push(w);wh.add(w.id);r.weighins++;}
  S=normalize(S);
  return r;
}
function importData(d){
  if(d&&d.type==='podhod-program'&&d.program&&Array.isArray(d.program.days)){
    mergeAll({exercises:d.exercises||[],programs:[d.program]});S.activeProgram=d.program.id;save();askPersist();
    return `Программа «${d.program.title}» загружена`;
  }
  if(d&&d.app==='podhod'){
    const r=mergeAll(d);save();askPersist();
    const parts=[r.sessions?pl(r.sessions,'тренировка','тренировки','тренировок'):'',r.programs?pl(r.programs,'программа','программы','программ'):'',r.weighins?pl(r.weighins,'замер','замера','замеров'):''].filter(Boolean);
    return parts.length?'Добавлено: '+parts.join(', '):'Все уже было, ничего нового';
  }
  throw new Error('format');
}
$('#file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const msg=importData(JSON.parse(rd.result));render();toast(msg);}catch(err){toast('Не тот файл: нужен бэкап или программа');}};
  rd.onerror=()=>toast('Не получилось прочитать файл');
  rd.readAsText(f);
});

//==================== ТОСТ ====================
let toastT=null,toastFn=null;
function toast(msg,fn,label){
  const t=$('#toast');toastFn=fn||null;
  t.innerHTML=`<span>${esc(msg)}</span>${fn?`<button data-a="toastAct">${esc(label||'Вернуть')}</button>`:''}`;
  t.classList.toggle('top',stack.length>0);
  t.classList.add('on');clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('on');toastFn=null;},fn?6000:2800);
}
function hideToast(){clearTimeout(toastT);toastFn=null;$('#toast').classList.remove('on');}

//==================== ДЕЙСТВИЯ ====================
const ACT={
  go:d=>{closeAll();go(d.v);},
  start:()=>startWorkout(),
  switchDay:()=>switchDay(),
  closeSheet:()=>closeSheet(),
  closeAll:()=>closeAll(),
  confirmOk:()=>{const f=CONFIRM;CONFIRM=null;closeSheet();if(f)f();},
  ach:()=>openSheet(achSheet),
  openItem:d=>{curItem=+d.i;ed=null;openSheet(itemSheet);},
  edit:d=>{const row=+d.row;if(ed&&ed.row===row&&ed.f===d.f)ed=null;else ed={row,f:d.f,buf:'',fresh:true};renderSheet(true);},
  kp:d=>{
    if(!ed||!S.active)return;
    const it=S.active.items[curItem],e=ex(it.ex),st=it.sets[ed.row];let b=ed.fresh?'':ed.buf;
    if(d.k==='⌫')b=b.slice(0,-1);
    else if(d.k===','){if(!b.includes(','))b=(b||'0')+',';}
    else if(b.replace(',','').length<5)b=(b==='0'?'':b)+d.k;
    ed.buf=b;ed.fresh=false;applyField(st,ed.f,parseFloat(b.replace(',','.')),e);save();renderSheet(true);
  },
  kpStep:d=>{
    if(!ed||!S.active)return;
    const it=S.active.items[curItem],e=ex(it.ex),st=it.sets[ed.row];
    applyField(st,ed.f,round2(fieldVal(st,ed.f,e)+(+d.d)*stepOf(ed.f,e)),e);ed.fresh=true;save();renderSheet(true);
  },
  kpOk:()=>{ed=null;renderSheet(true);},
  addSet:()=>{const it=S.active.items[curItem],l=it.sets[it.sets.length-1];it.sets.push(l?Object.assign({},l):{w:0,r:10});ed=null;save();renderSheet(true);},
  rmSet:()=>{const it=S.active.items[curItem];if(it.sets.length>1)it.sets.pop();ed=null;save();renderSheet(true);},
  itemDone:()=>{
    const s=S.active,it=s.items[curItem],e=ex(it.ex);
    it.done=true;ed=null;save();closeAll();justDone=curItem;render();justDone=-1;
    const top=topW(cleanSets(it.sets)),prev=e.kind==='w'?allTimeTop(it.ex):0;
    if(prev>0&&top>prev)toast(`Новый рекорд: ${e.name} ${fnum(top)} кг!`);
    else if(s.items.every(i=>i.done))toast('Все сделано. Можно заканчивать');
  },
  itemUndo:()=>{S.active.items[curItem].done=false;save();closeAll();render();},
  pain:()=>{const it=S.active&&S.active.items[curItem];if(!it)return;it.pain=!it.pain;ed=null;save();render();renderSheet(true);},
  feel:d=>{const s=S.sessions.find(x=>x.id===d.id);if(!s)return;s.feel=s.feel===d.v?null:d.v;save();renderSheet(true);},
  stats:d=>{statsEx=d.ex;ed=null;openSheet(statsSheet);},
  per:d=>{statsPer=d.p;renderSheet(true);},
  addEx:()=>{exQuery='';openSheet(addExSheet);},
  pickEx:d=>addItemFor(d.ex),
  newEx:()=>{newEx={name:exQuery.trim(),group:'Другое',kind:'w'};openSheet(newExSheet);},
  nxGroup:d=>{newEx.group=d.g;renderSheet(true);},
  nxKind:d=>{newEx.kind=d.k;renderSheet(true);},
  nxSave:()=>{
    const name=(newEx.name||'').trim();if(!name){toast('Напиши название');return;}
    const e={id:'u:'+uid(),name,group:newEx.group,kind:newEx.kind,x2:false,step:newEx.kind==='w'?2.5:1};
    if(e.kind==='time')e.tu='min';
    S.exercises.push(e);EXI=null;stack.pop();addItemFor(e.id);
  },
  finish:()=>{
    const s=S.active,doneN=s.items.filter(i=>i.done||i.pain).length;
    if(!doneN){confirmSheet('Ничего не отмечено','Отметь сделанные упражнения кнопкой «Готово». Или отмени тренировку, если зашел случайно.','Отменить тренировку',cancelWorkout,true);return;}
    const left=s.items.filter(i=>!i.done);
    if(left.length)confirmSheet('Закончить тренировку?',`Не отмечено: ${left.map(i=>esc(ex(i.ex).name)).join(', ')}.`,'Закончить',finishWorkout);
    else finishWorkout();
  },
  cancelWorkout:()=>confirmSheet('Отменить тренировку?','Записанные в ней подходы удалятся.','Отменить',cancelWorkout,true),
  openSession:d=>openSheet(()=>sessionSheet(d.id)),
  delSession:d=>{
    const id=d.id;
    confirmSheet('Удалить тренировку?','','Удалить',()=>{
      const i=S.sessions.findIndex(s=>s.id===id);if(i<0)return;
      const [s]=S.sessions.splice(i,1);S.meta.deleted.push(id);save();closeAll();render();
      toast('Тренировка удалена',()=>{S.sessions.push(s);S.meta.deleted=S.meta.deleted.filter(x=>x!==id);sortSessions(S);save();render();});
    },true);
  },
  addWeigh:()=>openSheet(()=>`<div class="h2">Новый замер</div><div class="form">
    <label>Дата</label><input type="date" id="wDate" value="${today()}">
    <div class="g2"><div><label>Вес, кг</label><input id="wW" inputmode="decimal"></div><div><label>Жир, %</label><input id="wFat" inputmode="decimal"></div></div>
    <div class="g2"><div><label>Мышцы, кг</label><input id="wMus" inputmode="decimal"></div><div><label>Вода, %</label><input id="wWat" inputmode="decimal"></div></div>
    <div class="g2"><div><label>Висц. жир</label><input id="wVis" inputmode="decimal"></div><div></div></div></div>
    <div class="row2"><button class="btn-black" data-a="saveWeigh">Сохранить</button></div>`),
  saveWeigh:()=>{
    const num=id=>{const v=parseFloat(($(id).value||'').replace(',','.'));return isNaN(v)?null:v;};
    const w=num('#wW'),date=$('#wDate').value||today();
    if(w==null){toast('Нужен хотя бы вес');return;}
    S.weighins.push({id:'w:'+uid(),date,w,fat:num('#wFat'),muscle:num('#wMus'),water:num('#wWat'),visc:num('#wVis'),src:'app'});
    S=normalize(S);save();closeAll();render();toast('Замер сохранен');
  },
  delWeigh:d=>{const w=S.weighins.find(x=>x.id===d.id);if(!w)return;
    confirmSheet('Удалить замер?',`${fnum(w.w)} кг, ${fday(w.date)}`,'Удалить',()=>{S.weighins=S.weighins.filter(x=>x.id!==w.id);save();render();},true);},
  addCardio:()=>{if(!S.exercises.some(e=>e.group==='Кардио')){S.exercises.push({id:'u:cardio-run',name:'Беговая дорожка',group:'Кардио',kind:'time',tu:'min',dist:true,step:1});EXI=null;}openSheet(cardioSheet);},
  cardioPick:d=>{const m=$('#cMin').value,k=$('#cKm').value,dt=$('#cDate').value;cardioEx=d.ex;renderSheet(true);$('#cMin').value=m;$('#cKm').value=k;$('#cDate').value=dt;},
  saveCardio:()=>{
    const num=id=>{const v=parseFloat(($(id).value||'').replace(',','.'));return isNaN(v)?null:v;};
    const m=num('#cMin'),km=num('#cKm'),date=$('#cDate').value||today();
    if(!m){toast('Нужны минуты');return;}
    const set={t:Math.round(m*60)};if(km)set.d=km;
    if(S.active&&date===S.active.date)S.active.items.push({ex:cardioEx,sets:[set],done:true,pain:false,req:false,plan:null});
    else{S.sessions.push({id:uid(),date,start:pday(date).getTime()+12*36e5,end:null,src:'app',kind:'cardio',prog:null,day:null,title:'Кардио',items:[{ex:cardioEx,sets:[set]}]});sortSessions(S);}
    save();closeAll();render();toast('Кардио записано');
  },
  // случайный тап в первые 0,7 сек только досматривает анимацию, а не закрывает окно
  revealNext:()=>{if(!REV)return;const r=$('#reveal');
    if(performance.now()-REV.t0<(REDUCED?300:700)){if(document.getAnimations)document.getAnimations().forEach(x=>{const t=x.effect&&x.effect.target;if(t&&r.contains(t))x.finish();});return;}
    const back=REV.back;REV=null;showRev();if(back&&back.focus&&document.contains(back))try{back.focus({preventScroll:true});}catch(e){}},
  badgeInfo:d=>{const s=achS(d.k),i=+d.i,n=lvl(s,i),a=achCompute(),e=a.list.find(x=>x.k===d.k&&x.i===i);
    if(e)toast(`${s.t(n)} · уровень ${i+1} · ${fday(e.date)}`);
    else{const left=Math.max(0,Math.ceil(n-achCur(a,d.k,weekInfo(prog()))));toast(`${s.t(n)} — еще ${achLeft(d.k,left)}`);}},
  bodyPer:d=>{bodyPer=d.p;render();},
  bodyMetric:d=>{bodyMetric=d.m;render();},
  backup:()=>exportBackup(),
  import:()=>$('#file').click(),
  restoreSnap:d=>confirmSheet('Вернуть снимок?',`Данные станут такими, какими были на начало дня ${fday(d.k.slice(5))}. Перед этим лучше сохранить бэкап.`,'Вернуть',async()=>{
    try{const raw=await kvGet(d.k);S=normalize(JSON.parse(raw));EXI=null;save();render();toast('Снимок возвращен');}catch(e){toast('Не получилось вернуть снимок');}
  },true),
  toastAct:()=>{const f=toastFn;toastFn=null;$('#toast').classList.remove('on');if(f)f();},
};
